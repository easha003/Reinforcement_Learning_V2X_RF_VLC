schema_version: "1.0"

project:
  name: "hybrid-rf-vlc-rl"
  experiment: "mean-field-rl-extension"
  description: "Constrained mean-field reinforcement learning for hybrid RF/VLC V2X allocation"

geometry:
  tagged_pair_mode: "longitudinal_following"
  # Widened from 5-40 m on 2026-08-04.  Two reasons, both measured.
  #
  # Optical power falls as 1/d^2 while RF at these ranges keeps 40 dB of
  # margin, so the far end of the window is a regime where V-VLC degrades and
  # the radio does not -- a complementarity axis the policy observes directly.
  #
  # And an *adjacent* pair at 5-15 m has nowhere for a third vehicle to insert:
  # a cut-in needs 4.5 + 2 x 2.5 = 9.5 m.  With lane changing but the narrow
  # window, only 5% of episodes ever saw a vehicle between the pair and
  # mid-block unavailability reached 0.58%.  The window is what lets the
  # lane-change mechanism of section 4.9 stage 1 actually bite.
  min_separation_m: 5.0
  max_separation_m: 100.0
  rf_antenna_height_m: 1.5
  headlamp_height_m: 0.7
  # Rear lamps and reflectors sit at 0.35-0.6 m on real vehicles.  Equal to the
  # headlamp height until 2026-08-10, which put the optical link exactly on an
  # ECE low beam's cut-off -- the one elevation a headlamp is engineered to keep
  # dark, because its purpose is not to dazzle oncoming drivers.  That was a
  # simulation convenience inherited from the planar-path simplification, not a
  # design choice, and no deployment would place a receiver there.  Occlusion is
  # unchanged: every vehicle class is at least 1.5 m and blocks either path.
  # 0.55 m, giving a 0.15 m drop from the 0.7 m headlamp. The drop sets the
  # vertical emission angle as -atan(dh/d), so it decides which row of the beam
  # a pair samples -- and, critically, whether that row is one ECE R112 actually
  # specifies. R112 stops at 4D. At the previous 0.40 m the drop was 0.30 m and
  # 4D was reached at 4.29 m, which put 56% of density-30 pair-instants below
  # anything the regulation describes. At 0.15 m the 4D crossing falls to 2.15 m,
  # under the IDM's 2.5 m minimum gap, so essentially every pair is sampled
  # inside the regulated domain. At 10 m it lands on 0.86D -- the 50V/50R
  # hot-spot row.
  photodiode_height_m: 0.55
  exact_geometry_hidden_from_policy: true
  include_building_nlos: true

cost:
  units: "normalized_activation"
  rf_activation: 1.0
  vlc_activation: 1.0
  dup_activation: 2.0
  vlc_to_rf_sensitivity: [0.3, 0.5, 1.0]

environment:
  actions: ["RF", "VLC", "DUP"]
  episode_duration_s: 60.0
  packets_per_episode: 600
  matched_random_tapes: true
  sample_binary_outcomes: true
  splits:
    train:
      - "synthetic-d10-train-000"
      - "synthetic-d20-train-000"
      - "synthetic-d30-train-000"
      - "synthetic-d10-train-001"
      - "synthetic-d20-train-001"
      - "synthetic-d30-train-001"
      - "synthetic-d10-train-002"
      - "synthetic-d20-train-002"
      - "synthetic-d30-train-002"
    validation:
      - "synthetic-d10-validation-000"
      - "synthetic-d20-validation-000"
      - "synthetic-d30-validation-000"
    test:
      - "synthetic-d10-test-000"
      - "synthetic-d20-test-000"
      - "synthetic-d30-test-000"
      - "synthetic-d10-test-001"
      - "synthetic-d20-test-001"
      - "synthetic-d30-test-001"
      - "synthetic-d10-test-002"
      - "synthetic-d20-test-002"
      - "synthetic-d30-test-002"

paths:
  project_root: "."
  artifact_root: "artifacts"
  calibration_root: "artifacts/calibration"
  trace_root: "artifacts/traces"
  checkpoint_root: "artifacts/checkpoints"
  evaluation_root: "artifacts/evaluations"
  figure_root: "artifacts/figures"
