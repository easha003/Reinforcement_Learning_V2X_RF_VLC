training:
  algorithm: "primal_dual_ppo"
  root_seed: 20260728
  policy_seeds: [1001, 1002, 1003, 1004, 1005]
  total_transitions_per_seed: 10000000
  architecture:
    actor_hidden_units: [64, 64]
    reward_critic_hidden_units: [64, 64]
    cost_critic_hidden_units: [64, 64]
    activation: "tanh"
    recurrent: false
  rollout_packets: 32768
  minibatch_size: 1024
  update_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coefficient: 0.01
  cost_signal: "conditional_miss_probability"
  curriculum:
    - fraction: 0.10
      miss_budget: 0.01
    - fraction: 0.20
      miss_budget: 0.001
    - fraction: 0.70
      miss_budget: 0.0001
  density_multipliers:
    - density_veh_per_lane_km: 10.0
      initial_value: 0.0
      learning_rate: 0.05
      maximum: 1000000.0
    - density_veh_per_lane_km: 20.0
      initial_value: 0.0
      learning_rate: 0.05
      maximum: 1000000.0
    - density_veh_per_lane_km: 30.0
      initial_value: 0.0
      learning_rate: 0.05
      maximum: 1000000.0
  checkpoint_selection: "reliability_then_cost"
  normalize_observations_on_training_only: true
