evaluation:
  profile: "primary"
  policies:
    - "rf_only"
    - "vlc_only"
    - "always_dup"
    - "forecast_aware_gate"
    - "constrained_contextual"
    - "fixed_penalty_ppo"
    - "primal_dual_ppo"
    - "oracle"
  min_packets_per_policy_density: 1000000
  min_trajectory_pair_clusters: 200
  confidence_level: 0.95
  one_sided_upper_bound: true
  interval_method: "trajectory_block_bootstrap"
  bootstrap_replicates: 10000
  matched_across_policies: true
  report_raw_counts: true
  require_upper_bound_below_budget: true
